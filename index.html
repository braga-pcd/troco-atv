<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculo-troco</title>
</head>
<body>
    <div>
        <label for="preco">Preço do produto:</label>
        <input type="number" id="preco" placeholder="Digite perço">
    </div>

    <div>
        <label for="qntd">Quantidade comprada:</label>
        <input type="number" id="qntd" placeholder="Digite perço">

    </div>

    <button id ="calcular">Calcular</button>

    <p id="resultado"></p>
    
    <script src="screip.js"></script>
</body>
</html>
